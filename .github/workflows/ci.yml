name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Opt-in para Node 24 nas JS actions (default a partir de 02/06/2026).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Segredos reais sao gerenciados na Vercel (Production/Preview).
      # O CI roda com defaults do schema em src/lib/env.ts: todas as envs
      # estao como .optional() ou tem default no Zod, entao build/test passam
      # sem nenhuma credencial real.
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Build (Next.js production)
        run: npm run build
